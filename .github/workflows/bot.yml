name: Bot marche
on:
  schedule:
    - cron: "*/5 6-21 * * 1-5"
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurer l'etat
        uses: actions/cache/restore@v4
        with:
          path: bot_state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python market_bot.py once
      - name: Sauver l'etat
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot_state.json
          key: state-${{ github.run_id }}
          
